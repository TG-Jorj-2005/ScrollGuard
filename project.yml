# XcodeGen spec. `xcodegen generate` creates ScrollGuard.xcodeproj from this file; the .xcodeproj
# is not committed. GitHub Actions does it on every build (.github/workflows/build.yml).
name: ScrollGuard
options:
  bundleIdPrefix: io.github.tg-jorj-2005
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  ScrollGuard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      # The filter (JavaScript and CSS) is copied into the app bundle as resources.
      - path: Web
        buildPhase: resources
    settings:
      base:
        # Keep this the same from one build to the next. SideStore then updates the installed
        # app in place (you stay signed in) and reuses the same App ID, instead of using up
        # another of the 10 a free Apple account may register per week.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tg-jorj-2005.scrollguard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScrollGuard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        # Asked only if Instagram itself requests them (a story, a voice message). ScrollGuard
        # never records anything.
        NSCameraUsageDescription: "Instagram wants to use the camera."
        NSMicrophoneUsageDescription: "Instagram wants to use the microphone."

schemes:
  ScrollGuard:
    build:
      targets:
        ScrollGuard: all
